name: zcashd book

# Inherited from upstream Ycash. It triggers on `master`, a branch this fork does not carry, so it never
# runs here; kept (not deleted) so the fork's delta stays small. Since 2026-10-06 its actions are pinned
# by commit and its token is least-privilege (actionlint + zizmor clean), like every workflow in the fork.
on:
  push:
    branches:
      - master

permissions: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # peaceiris/actions-gh-pages pushes the built book to the gh-pages branch
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup mdBook
        uses: peaceiris/actions-mdbook@ee69d230fe19748b7abf22df32acaa93833fad08 # v2.0.0
        with:
          mdbook-version: '0.4.7'

      - name: Install mdbook-katex
        # Was actions-rs/cargo@v1 (archived, node12 runtime); the runner image carries cargo.
        run: cargo install mdbook-katex

      - name: Build zcashd book
        run: mdbook build doc/book/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./book/book

name: ydollar tests

# Fork-local CI for the YDollar overlay. Upstream Ycash runs no tests in CI (book.yml only).
# Uses the same zcutil/build.sh a developer runs locally so a green CI and a green laptop mean the
# same thing. See docs/plans/ydollar-v1-development-plan.md §6.0 item 6 in the workspace.

on:
  push:
    branches:
      - feature/digidollar
  pull_request:
    branches:
      - feature/digidollar
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libc6-dev m4 g++-multilib \
            autoconf libtool ncurses-dev unzip git python3 python3-zmq zlib1g-dev curl bsdmainutils \
            automake libtinfo5

      - name: Cache depends
        id: cache-depends
        uses: actions/cache@v4
        with:
          path: |
            depends/x86_64-pc-linux-gnu
            depends/built
            depends/sources
          key: depends-${{ runner.os }}-${{ hashFiles('depends/packages/**', 'depends/Makefile', 'depends/hosts/**', 'depends/builders/**') }}

      - name: Build depends
        if: steps.cache-depends.outputs.cache-hit != 'true'
        run: BUILD_STAGE=depends ./zcutil/build.sh -j$(nproc)

      - name: Cache zk parameters
        id: cache-params
        uses: actions/cache@v4
        with:
          path: ~/.zcash-params
          key: zcash-params-${{ hashFiles('zcutil/fetch-params.sh') }}

      - name: Fetch zk parameters
        if: steps.cache-params.outputs.cache-hit != 'true'
        run: ./zcutil/fetch-params.sh

      - name: Build ycashd
        run: ./zcutil/build.sh -j$(nproc)

      - name: Unit tests (ydollar_*)
        run: src/test/test_bitcoin --run_test='ydollar_*' --log_level=test_suite

      - name: Functional tests (ydollar_*)
        # Names must be listed explicitly: rpc-tests.py does not glob (G3). Extend this list as
        # phases add scripts to BASE_SCRIPTS.
        run: |
          qa/pull-tester/rpc-tests.py -j4 --nozmq \
            ydollar_index

      - name: Upload node logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ydollar-test-logs
          path: |
            /tmp/**/node*/regtest/debug.log
            /tmp/**/ydollar-fed*.log
          if-no-files-found: ignore

  nightly:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-22.04
    timeout-minutes: 600
    steps:
      - uses: actions/checkout@v4
      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libc6-dev m4 g++-multilib \
            autoconf libtool ncurses-dev unzip git python3 python3-zmq zlib1g-dev curl bsdmainutils \
            automake libtinfo5
      - uses: actions/cache@v4
        with:
          path: |
            depends/x86_64-pc-linux-gnu
            depends/built
            depends/sources
          key: depends-${{ runner.os }}-${{ hashFiles('depends/packages/**', 'depends/Makefile', 'depends/hosts/**', 'depends/builders/**') }}
      - uses: actions/cache@v4
        with:
          path: ~/.zcash-params
          key: zcash-params-${{ hashFiles('zcutil/fetch-params.sh') }}
      - run: ./zcutil/fetch-params.sh
      - run: ./zcutil/build.sh -j$(nproc)
      - name: Full make check
        run: make check
      - name: Inherited functional tests recorded as passing in Phase 0
        # Fill in from doc/ydollar.md "Build and test baseline".
        run: qa/pull-tester/rpc-tests.py -j4 --nozmq

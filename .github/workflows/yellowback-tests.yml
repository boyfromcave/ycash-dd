name: yellowback tests

# Fork-local CI for Ycash Yellowback (YED). Upstream Ycash runs no tests in CI (book.yml only).
# The same zcutil/build.sh a developer runs locally, so a green CI and a green laptop mean the
# same thing. Layout per the workspace plan (docs/plans/yellowback-v2-development-plan.md, §6.0
# item 6): `main`, `audit` and `python` block merges; `nightly`, `weekly-fuzz` and the three
# variant builds `lockorder`, `sanitizers` and `coverage` (Phase 3, P6) open an issue.
#
# Functional scripts are listed by name: rpc-tests.py does not glob. YELLOWBACK_SCRIPTS is the
# current phase's list (Phase 3: yellowback_index yellowback_activation yellowback_rpc_contract;
# yellowback_mining and yellowback_enforcement join as Phases 4-5 land; the wallet-flow scripts
# return at Phase 6, N26). SANITIZER_SCRIPTS is the subset the sanitizers job runs (§6.0 item 6:
# yellowback_index yellowback_enforcement yellowback_mining once the latter two exist).
# STOCK_BASELINE is the inherited Ycash suite that must keep passing against
# the fork binary without -yellowback (P5); the names recorded as passing in Phase 0 are in
# doc/yellowback.md "Build and test baseline".

on:
  push:
    branches:
      - feature/yellowback-sf
      - feature/yellowback-price-attest
  pull_request:
    branches:
      - feature/yellowback-sf
      - feature/yellowback-price-attest
  schedule:
    - cron: '0 3 * * *'
    - cron: '0 4 * * 0'
  workflow_dispatch:

env:
  # Plan section 6.0 item 6's list for Phase 6 and after, plus yellowback_hardening (Phase 8,
  # written after that list). Each phase registered its script in qa/pull-tester/rpc-tests.py but
  # this variable was not updated with it, so mining, enforcement, stock_node and hardening — the
  # soft fork's own safety evidence among them — were never run by CI. Added 2026-09-11.
  # yellowback_quote is still absent: it starts the quote agent, which reads TOML with the stdlib
  # tomllib (Python >= 3.11) while this job runs ubuntu-22.04's 3.10, and moving the job to 3.11
  # also moves it off the apt python3-zmq the prerequisite step imports. Its unit tests do run, in
  # the python job. Closing that gap is a CI change on its own.
  YELLOWBACK_SCRIPTS: yellowback_index yellowback_activation yellowback_mining yellowback_enforcement yellowback_lifecycle yellowback_claim yellowback_void_mint yellowback_pricefeed yellowback_wallet_restore yellowback_sapling yellowback_stock_node yellowback_rpc_contract yellowback_hardening
  SANITIZER_SCRIPTS: yellowback_index
  # The plan's list is eleven scripts; four fail at the pin itself (recorded in doc/yellowback.md,
  # Phase 0 baseline): getblocktemplate_proposals, getblocktemplate_longpoll and invalidateblock
  # abort ycashd in CChainParams::GetFoundersRewardAddressAtHeight (chainparams.cpp, zero lines
  # changed) because a stock regtest node activates no Ycash upgrade, and p2p-acceptblock expects
  # Bitcoin's unrequested-block behaviour. They rejoin the list when the Phase 3 wrapper passes
  # the six -nuparams to every node.
  STOCK_BASELINE: mempool_reorg mempool_tx_expiry reorg_limit reindex wallet rawtransactions txn_doublespend

jobs:
  main:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libc6-dev m4 g++-multilib \
            autoconf libtool ncurses-dev unzip git python3 python3-zmq zlib1g-dev curl bsdmainutils \
            automake libtinfo5

      - name: Install Python test prerequisites
        # Mirrors scripts/bootstrap.sh in the workspace: the inherited qa/ framework imports
        # simplejson and pyblake2 (unmaintained; the stdlib blake2b has the same API, so a
        # one-line shim stands in for it). No framework file is changed.
        run: |
          python3 -m pip install --user simplejson
          site=$(python3 -c 'import site; print(site.getusersitepackages())')
          mkdir -p "$site"
          printf '%s\n' '"""Shim: pyblake2 is unmaintained; Python 3.6+ has hashlib.blake2b with the same API."""' \
                        'from hashlib import blake2b, blake2s  # noqa: F401' > "$site/pyblake2.py"
          python3 -c 'import asyncore, zmq, simplejson, pyblake2'

      - name: Cache depends
        id: cache-depends
        uses: actions/cache@v4
        with:
          path: |
            depends/x86_64-pc-linux-gnu
            depends/built
            depends/sources
          key: depends-${{ runner.os }}-${{ hashFiles('depends/packages/**', 'depends/Makefile', 'depends/hosts/**', 'depends/builders/**') }}

      - name: Build depends
        if: steps.cache-depends.outputs.cache-hit != 'true'
        run: BUILD_STAGE=depends ./zcutil/build.sh -j$(nproc)

      - name: Cache zk parameters
        id: cache-params
        uses: actions/cache@v4
        with:
          path: ~/.zcash-params
          key: zcash-params-${{ hashFiles('zcutil/fetch-params.sh') }}

      - name: Fetch zk parameters
        if: steps.cache-params.outputs.cache-hit != 'true'
        run: ./zcutil/fetch-params.sh

      - name: Build ycashd
        run: ./zcutil/build.sh -j$(nproc)

      - name: Unit tests (the whole test_bitcoin, P5)
        # Not only yellowback_*: the Phase 3 hooks sit in files that miner_tests, main_tests,
        # mempool_tests and rpc_tests cover.
        run: src/test/test_bitcoin --log_level=test_suite

      - name: Functional tests (Yellowback scripts of this phase)
        # Runs even when an earlier step failed (the job still fails overall). A step that aborts
        # the job hides everything after it: while two inherited unit cases were failing, this
        # step and the one below never executed at all, so no functional suite had ever run on CI.
        # One red result must never mask twelve unknown ones.
        if: ${{ !cancelled() }}
        # TMPDIR keeps every test's mkdtemp() under one directory we own, so the log upload below
        # does not have to glob all of /tmp (root-only /tmp/snap-private-tmp on the GitHub runners
        # makes upload-artifact fail with EACCES). --nocleanup is forwarded to every script:
        # without it test_framework.py rmtree()s its tmpdir even when the test fails.
        env:
          TMPDIR: ${{ runner.temp }}/yellowback-tests
        run: |
          mkdir -p "$TMPDIR"
          qa/pull-tester/rpc-tests.py -j4 --nozmq --nocleanup $YELLOWBACK_SCRIPTS

      - name: Functional tests (inherited stock baseline, without -yellowback)
        if: ${{ !cancelled() }}
        env:
          TMPDIR: ${{ runner.temp }}/yellowback-tests
        run: |
          mkdir -p "$TMPDIR"
          qa/pull-tester/rpc-tests.py -j4 --nozmq --nocleanup $STOCK_BASELINE

      - name: Upload node logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: yellowback-test-logs
          path: |
            ${{ runner.temp }}/yellowback-tests/**/node*/regtest/debug.log
          if-no-files-found: ignore

  audit:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch the pristine baseline branch and the v2 baseline
        # Every diff below is against ycash-legacy (= upstream v4.5.0), and the v3 frozen-file check
        # against feature/yellowback-sf (= v2 complete). A missing branch is an error, never a
        # vacuous pass.
        run: |
          git fetch --no-tags origin +refs/heads/ycash-legacy:refs/heads/ycash-legacy
          git rev-parse --verify ycash-legacy
          git fetch --no-tags origin +refs/heads/feature/yellowback-sf:refs/remotes/origin/feature/yellowback-sf
          git rev-parse --verify origin/feature/yellowback-sf

      - name: Zero delta in the frozen files vs feature/yellowback-sf (v3 plan §4.1, §8.4 item 1)
        # v3 adds no line to the soft-fork hooks, the policy layer or the consensus set: the list
        # is the one file qa/yellowback-frozen-files.txt (quoted by the plan and the PR template),
        # one path per line, directories allowed. --quiet exits 1 on any difference; the diff is
        # printed first so the reviewer sees what moved.
        run: |
          set -e
          test -s qa/yellowback-frozen-files.txt
          frozen=$(grep -v '^#' qa/yellowback-frozen-files.txt | grep -v '^$')
          echo "frozen set:"; echo "$frozen"
          git --no-pager diff --stat origin/feature/yellowback-sf...HEAD -- $frozen
          git diff --quiet origin/feature/yellowback-sf...HEAD -- $frozen

      - name: Line budget and the consensus zero set (plan §4.1)
        run: |
          set -e
          for f in src/main.cpp:40 src/miner.cpp:35 src/rpc/mining.cpp:35; do
            p=${f%%:*}; b=${f##*:}
            n=$(git diff --numstat ycash-legacy...HEAD -- $p | awk '{s+=$1+$2} END {print s+0}')
            echo "$p: $n changed lines (budget $b)"
            test "$n" -le "$b" || exit 1
          done
          # Zero lines in the consensus set of plan §4.1. Phase 8's wallet-tier hardening (H5/H7/H8)
          # landed 2026-09-11, so src/wallet/rpcwallet.cpp, src/wallet/rpcdump.cpp and
          # src/rpc/rawtransaction.cpp have left this set (M7) and the wallet core is named
          # explicitly: src/wallet/wallet.{h,cpp} stay at zero, the rest of src/wallet does not.
          test -z "$(git diff --stat ycash-legacy...HEAD -- src/consensus src/script src/primitives src/pow src/chainparams.cpp src/wallet/wallet.h src/wallet/wallet.cpp src/txdb.cpp src/txdb.h configure.ac)"

      - name: Determinism, no clock, no sockets, no bans (plan §3.10, §8.4 items 2 and 8)
        # The state machine and the pure modules may not read the clock, the mempool, the wallet
        # or configuration, and never use floating point. Comment lines are skipped (they may
        # name what is forbidden). tag.cpp joins the list when Phase 1 adds it (K23).
        run: |
          set -e
          # attest and bundle join the set in v3 (plan §3.10); they exist from Phase A0's crypto chunk.
          pure=""
          for f in state math tag payload script view attest bundle; do
            for x in src/yellowback/$f.cpp src/yellowback/$f.h; do test -f "$x" && pure="$pure $x"; done
          done
          echo "pure modules:$pure"
          ! grep -n "GetTime\|GetAdjustedTime\|mempool\|pwalletMain\|GetArg\|double\|float" $pure | grep -v ':[0-9]*:[[:space:]]*\(//\|\*\)'
          # libsecp256k1 is reached through one wrapper only, VerifyCompactSig in attest.cpp (v3 §3.10,
          # §8.4 item 2), so the fuzz harness can stub it and low-S is enforced in one place. Comment
          # lines are skipped; nothing else under src/yellowback or src/rpc/yellowback* may name it.
          ! grep -n "secp256k1_" src/yellowback/*.cpp src/yellowback/*.h src/rpc/yellowback*.cpp 2>/dev/null | grep -v '^src/yellowback/attest\.cpp:' | grep -v ':[0-9]*:[[:space:]]*\(//\|\*\)'
          # index.cpp may read the mempool (RemoveInvalidVaultSpends) but never the clock or floating point.
          ! grep -n "GetTime\|GetAdjustedTime\|double\|float" src/yellowback/index.cpp src/yellowback/index.h | grep -v ':[0-9]*:[[:space:]]*\(//\|\*\)'
          # GetTime() has two homes only: the quote RPC (stamps receivedAt) and policy.cpp (BuildTagScript), M11.
          homes=$(grep -l "GetTime\|GetAdjustedTime" src/yellowback/*.cpp src/rpc/yellowback*.cpp 2>/dev/null | grep -v 'yellowback/policy.cpp\|rpc/yellowback.cpp' || true)
          test -z "$homes" || { echo "GetTime outside its two homes: $homes"; exit 1; }
          # Never ban a peer for a Yellowback verdict (N1): DoS(0) only, ever.
          ! grep -n "DoS([1-9]" src/yellowback/*.cpp src/rpc/yellowback*.cpp src/main.cpp
          # EvaluateBlock is total (K1): no throw, no assert in the state machine or the arithmetic.
          ! grep -n "throw\|assert(" src/yellowback/state.cpp src/yellowback/math.h
          # The overlay adds no networking to the node (anchored: UndoDisconnect( must not match).
          ! grep -nE "evhttp|socket|\bconnect\(" src/yellowback/*.cpp src/yellowback/*.h src/rpc/yellowback*.cpp
          # The transaction_builder extension is called only by the Yellowback builder and its tests (§8.4 item 22).
          ! git grep -n "AddTransparentInputUnsigned\|SetLockTime(" -- src ':!src/transaction_builder.h' ':!src/transaction_builder.cpp' ':!src/yellowback/' ':!src/test/yellowback_*'

      - name: Documents (fork-local only, P4)
        # Staleness against the plan is a workspace check (make status -> spec-check), not a fork check.
        run: |
          set -e
          ! grep -q 'no consensus change' doc/yellowback.md
          grep -q 'federation prototype, being replaced' doc/yellowback.md
          grep -q 'Build and test baseline' doc/yellowback.md
          # The published spec copy was not hand-edited: its header hash equals the hash of its body.
          test "$(sed -n 's/^Source: .*sha256: \([0-9a-f]*\).*/\1/p' doc/yellowback-spec.md)" = "$(sed '1,/^---$/d' doc/yellowback-spec.md | sha256sum | cut -c1-64)"
          # The trust statement in doc/yellowback.md is the spec's §8.1, byte for byte (leading and
          # trailing blank lines aside).
          section() { awk -v h="$1" '$0 ~ h {f=1; next} f && /^#/ {exit} f' "$2" | awk 'NF{p=1} p' | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}'; }
          diff <(section '^### 8\.1 ' doc/yellowback-spec.md) <(section '^## Trust statement' doc/yellowback.md)
          python3 -c 'import json; json.load(open("doc/yellowback-rpc-contract.json"))'

      - name: v2 gates (blocking from Phase 3)
        # Every yed_* the node registers is in the RPC contract (P7); the Phase 3 acceptance
        # checks; and the federation is gone from the module (the whole-directory roster grep, N26).
        run: |
          set -e
          registered=$(grep -oh '"yed_[a-z]*"' src/rpc/yellowback*.cpp | tr -d '"' | sort -u)
          missing=$(for c in $registered; do python3 -c "import json,sys; d=json.load(open('doc/yellowback-rpc-contract.json')); sys.exit(0 if '$c' in d else 1)" || echo "$c"; done)
          test -z "$missing" || { echo "registered but not in doc/yellowback-rpc-contract.json: $missing"; exit 1; }
          ! git grep -in roster -- src/yellowback
          test -f doc/yellowback-rpc.md && grep -q 'rpcversion 3' doc/yellowback-rpc.md
          python3 -c 'import json,sys; d=json.load(open("doc/yellowback-rpc-contract.json")); sys.exit(0 if "yed_getinfo" in d and "suppressedBlocks" in d["yed_getinfo"]["returns"] else 1)'
          # v3 contract (Phase A0): rpcversion 3, the attest object on yed_getinfo, every §4.5 command and
          # error identifier present in the generated JSON — the C++ agents implement these names.
          python3 - <<'PY'
          import json, sys
          d = json.load(open("doc/yellowback-rpc-contract.json"))
          missing = []
          if d.get("rpcversion") != 3: missing.append("rpcversion=3")
          if "attest" not in d["yed_getinfo"]["returns"]: missing.append("yed_getinfo.attest")
          for c in ["yed_listattestors", "yed_getattestations", "yed_addattestation", "yed_buildbundle", "yed_getselection",
                    "yed_getnotice", "yed_claimnotice", "yed_sweepcarriers", "yed_registerattestor", "yed_withdrawbond",
                    "yed_revive", "yed_reportequivocation", "yed_signattestation"]:
              if c not in d: missing.append(c)
          for e in ["attest-unknown-seq", "attest-not-eligible", "attest-stale", "attest-bad-sig", "attest-range",
                    "bundle-insufficient", "mint10-diverged", "notice-standing", "notice-not-underwater", "bond-below-min",
                    "lock-below-min", "bond-locked", "not-dormant", "not-equivocation", "attest-key-not-held",
                    "equivocation-guard"]:
              if e not in d["errors"]: missing.append("errors." + e)
          if missing: print("contract missing:", missing); sys.exit(1)
          PY
          # The spec copy carries the v3 delta (make spec appends the v3 plan's section 3).
          grep -q '^## v3 delta' doc/yellowback-spec.md
          test -f doc/yellowback-attestor.md && test -f qa/yellowback-frozen-files.txt
          git diff ycash-legacy...HEAD -- src/main.cpp | grep '^+' | grep 'DoS(' | { ! grep -v 'DoS(0'; }
          # Every inserted main.cpp statement is inside `if (g_yellowback)` (§8.4 item 2): the residual is printed for the reviewer.
          echo "main.cpp residual (lines not mentioning g_yellowback):"
          git diff ycash-legacy...HEAD -- src/main.cpp | grep '^+' | grep -v 'g_yellowback\|#include\|^+$\|^+++' || true

      - name: Rule -> test tags (blocking from Phase 6, §7)
        # Independent check: runs even if an earlier step failed, so one red result
        # does not hide the others. The job still fails overall.
        if: ${{ !cancelled() }}
        # Every identifier of §3.2 and §3.7-3.9 must appear on a `// Rule:` / `# Rule:` line of a
        # unit case or a functional script. TPL-1..3 arrive with Phase 4 and MINTPOL-1 with Phase 6,
        # so the loop reports until Phase 6's acceptance makes it block.
        continue-on-error: true
        run: |
          set -e
          tagged=$(grep -ho '^\(//\|#\) Rule: .*' src/test/yellowback_*.cpp qa/rpc-tests/yellowback_*.py | sed 's/.*Rule: //' | tr ' ' '\n' | sort -u)
          echo "rules with a tagged test:"; echo "$tagged" | tr '\n' ' '; echo
          test -n "$tagged"
          rc=0
          for id in TAG-1 TAG-2 TAG-3 TAG-4 TAG-5 PRICE-1 PRICE-2 SIGMA-1 FEE-0 FEE-1 FEE-2 FEE-W REG-1 REG-2 REG-3 REG-4 IN-1 IN-2 IN-3 TX-0 \
                    MINT-1 MINT-2 MINT-3 MINT-4 MINT-5 MINT-6 MINT-7 MINT-8 XFER-1 XFER-2 XFER-3 RED-1 RED-2 RED-3 RED-4 \
                    ACT-1 ACT-2 ACT-3 ACT-4 ACT-5 ACT-6 ACT-7 HALT-1 HALT-2 HALT-3 HALT-4 BLK-1 BLK-2 BLK-3 TPL-1 TPL-2 TPL-3 \
                    MP-1 MINER-1 MINER-2 MINER-3 MINTPOL-1 SNAP UNDO; do
            git grep -qE "^(//|#) Rule: .*\b$id\b" -- src/test/yellowback_*.cpp qa/rpc-tests/yellowback_*.py || { echo "no test tagged: $id"; rc=1; }
          done
          exit $rc

      - name: Rule -> test tags, v3 identifiers (blocking since Phase A1, v3 plan §7)
        # The v3 rules of plan §3.8 (ARM-1/2, REG-A1, BUNDLE-1, MINT-9/10, NOT-1, EQV-1, REV-1, PIN-1/2,
        # AFEE-0/1, RED-5) landed with Phase A1 (yellowback_state_tests.cpp); every identifier must be
        # tagged. Fold the list into the loop above when the v3 series merges into feature/yellowback-sf.
        if: ${{ !cancelled() }}
        run: |
          set -e
          rc=0
          for id in ARM-1 ARM-2 REG-A1 BUNDLE-1 MINT-9 MINT-10 NOT-1 EQV-1 REV-1 PIN-1 PIN-2 AFEE-0 AFEE-1 RED-5; do
            git grep -qE "^(//|#) Rule: .*\b$id\b" -- src/test/yellowback_*.cpp qa/rpc-tests/yellowback_*.py || { echo "no test tagged (v3): $id"; rc=1; }
          done
          exit $rc

  # The Rust attestor agent of v3 plan §5 (contrib/yellowback/attest/, Phase A4): built with the
  # toolchain its own rust-toolchain.toml pins, never by depends. Runs only when the crate exists —
  # a checkout without it (Phases A0-A3) skips every step and the job is green by construction.
  # GitHub's `paths:` filter is workflow-wide, not per job, so the gate is the presence check below
  # plus a cargo cache keyed on Cargo.lock; the crate is small and the job is cheap.
  agent:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Crate present?
        id: crate
        run: |
          if [ -f contrib/yellowback/attest/Cargo.toml ] && [ -f contrib/yellowback/attest/rust-toolchain.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"; echo "contrib/yellowback/attest/ not present yet (Phase A4); nothing to build"
          fi
      - name: Install the pinned toolchain (rust-toolchain.toml)
        if: steps.crate.outputs.present == 'true'
        # rustup reads rust-toolchain.toml from the working directory: the pin lives in the crate,
        # not in this workflow (v3 plan S8, W13).
        working-directory: contrib/yellowback/attest
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --no-modify-path --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" show
          "$HOME/.cargo/bin/rustup" component add clippy
      - uses: actions/cache@v4
        if: steps.crate.outputs.present == 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contrib/yellowback/attest/target
          key: attest-cargo-${{ runner.os }}-${{ hashFiles('contrib/yellowback/attest/Cargo.lock', 'contrib/yellowback/attest/rust-toolchain.toml') }}
      - name: cargo build --locked
        if: steps.crate.outputs.present == 'true'
        working-directory: contrib/yellowback/attest
        run: cargo build --locked
      - name: cargo test
        if: steps.crate.outputs.present == 'true' && !cancelled()
        working-directory: contrib/yellowback/attest
        run: cargo test --locked
      - name: cargo clippy -D warnings
        if: steps.crate.outputs.present == 'true' && !cancelled()
        working-directory: contrib/yellowback/attest
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: rustfmt
        if: steps.crate.outputs.present == 'true' && !cancelled()
        working-directory: contrib/yellowback/attest
        run: cargo fmt --check
      - name: expected.json is the Python aggregator's answer
        if: steps.crate.outputs.present == 'true' && !cancelled()
        working-directory: contrib/yellowback/attest
        run: python3 fixtures/expected.py && git diff --exit-code fixtures/expected.json
      - name: The sample configuration parses
        if: steps.crate.outputs.present == 'true' && !cancelled()
        working-directory: contrib/yellowback/attest
        run: cargo run --locked -q -- check-config --conf attest.toml.sample
      - name: No agent crate in the node's build (v3 plan §8.4 item 14)
        if: steps.crate.outputs.present == 'true' && !cancelled()
        run: |
          ! grep -q 'iroh' Cargo.lock
          ! ls depends/packages | grep -qi 'iroh\|yellowback-attest'

  python:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        # yellowback-quote reads TOML with the stdlib tomllib (Python >= 3.11, plan section 5);
        # ubuntu-22.04's python3 is 3.10. The functional script yellowback_quote.py runs the agent
        # too, so it joins the main job's list only once that job's interpreter is >= 3.11.
        with:
          python-version: '3.11'
      - run: python3 -m pip install --user pyflakes
      - name: Quote agent and price-feed unit tests (Phase 7)
        run: python3 -m unittest contrib/yellowback/test_yellowback_price.py contrib/yellowback/test_yellowback_quote.py
      - name: pyflakes (functional tests and the shared helpers)
        # Independent check: runs even if an earlier step failed, so one red result
        # does not hide the others. The job still fails overall. The two v3 framework files
        # (Phase A0's pyfw chunk) are listed by name; a file that is not there yet is skipped, one
        # that is there is checked.
        if: ${{ !cancelled() }}
        run: |
          files="qa/rpc-tests/yellowback_*.py qa/rpc-tests/test_framework/yellowback_util.py"
          for f in qa/rpc-tests/test_framework/yellowback_attest.py qa/rpc-tests/test_framework/test_yellowback_attest.py; do
            test -f "$f" && files="$files $f"
          done
          python3 -m pyflakes $files
      - name: sign_attestation known-answer test and the attest framework's unit tests (v3 plan §6.0 item 6)
        # test_framework/test_yellowback_attest.py holds the low-S known-answer vectors (R18) that the
        # C++ yellowback_attest_tests replays; it imports the inherited framework, hence the same
        # prerequisites the main job installs. Skipped, loudly, until the pyfw chunk lands.
        if: ${{ !cancelled() }}
        run: |
          if [ ! -f qa/rpc-tests/test_framework/test_yellowback_attest.py ]; then
            echo "qa/rpc-tests/test_framework/test_yellowback_attest.py not present yet (Phase A0 pyfw chunk)"; exit 0
          fi
          python3 -m pip install --user simplejson
          site=$(python3 -c 'import site; print(site.getusersitepackages())')
          mkdir -p "$site"
          printf '%s\n' '"""Shim: pyblake2 is unmaintained; Python 3.6+ has hashlib.blake2b with the same API."""' \
                        'from hashlib import blake2b, blake2s  # noqa: F401' > "$site/pyblake2.py"
          cd qa/rpc-tests && python3 -m unittest test_framework.test_yellowback_attest -v
      - name: pyflakes (contrib; blocking from Phase 7)
        # Independent check: runs even if an earlier step failed, so one red result
        # does not hide the others. The job still fails overall.
        if: ${{ !cancelled() }}
        run: python3 -m pyflakes contrib/yellowback/*.py contrib/yellowback/yellowback-quote contrib/yellowback/pool/check-coinbase contrib/yellowback/devnet/yellowback-devnet
      - name: The quote agent's acceptance line (plan Phase 7)
        run: contrib/yellowback/yellowback-quote --conf contrib/yellowback/pool/yellowback-quote.toml.sample --dry-run --mock-price /dev/stdin <<< 0.05
      - name: Fuzz corpora and the embedded replay tables agree (N34)
        # Independent check: runs even if an earlier step failed, so one red result
        # does not hide the others. The job still fails overall.
        if: ${{ !cancelled() }}
        # Also checks that src/test/data/yellowback_golden.json is the qa/ model's copy (N18, N23).
        run: python3 src/test/gen_yellowback_corpus.py --check

  # The attestor agent (plan §5, W13): its own toolchain (rust-toolchain.toml), its own lock,
  # never the node's depends/. Also proves fixtures/expected.json is still what the Python
  # aggregator (the reference) computes, so the Rust/Python cross-check cannot drift silently.
  nightly:
    if: (github.event_name == 'schedule' && github.event.schedule == '0 3 * * *') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 600
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libc6-dev m4 g++-multilib \
            autoconf libtool ncurses-dev unzip git python3 python3-zmq zlib1g-dev curl bsdmainutils \
            automake libtinfo5
      - name: Install Python test prerequisites
        run: |
          python3 -m pip install --user simplejson
          site=$(python3 -c 'import site; print(site.getusersitepackages())')
          mkdir -p "$site"
          printf '%s\n' '"""Shim: pyblake2 is unmaintained; Python 3.6+ has hashlib.blake2b with the same API."""' \
                        'from hashlib import blake2b, blake2s  # noqa: F401' > "$site/pyblake2.py"
          python3 -c 'import asyncore, zmq, simplejson, pyblake2'
      - uses: actions/cache@v4
        with:
          path: |
            depends/x86_64-pc-linux-gnu
            depends/built
            depends/sources
          key: depends-${{ runner.os }}-${{ hashFiles('depends/packages/**', 'depends/Makefile', 'depends/hosts/**', 'depends/builders/**') }}
      - uses: actions/cache@v4
        with:
          path: ~/.zcash-params
          key: zcash-params-${{ hashFiles('zcutil/fetch-params.sh') }}
      - run: ./zcutil/fetch-params.sh
      - run: ./zcutil/build.sh -j$(nproc)
      - name: Full make check
        run: make check
      - name: Inherited functional tests recorded as passing in Phase 0
        # Independent check: runs even if an earlier step failed, so one red result
        # does not hide the others. The job still fails overall.
        if: ${{ !cancelled() }}
        # The list is STOCK_BASELINE above, recorded by name in doc/yellowback.md "Build and test baseline".
        env:
          TMPDIR: ${{ runner.temp }}/yellowback-tests
        run: |
          mkdir -p "$TMPDIR"
          qa/pull-tester/rpc-tests.py -j4 --nozmq --nocleanup $STOCK_BASELINE
      - name: Reorg stress (extended)
        env:
          TMPDIR: ${{ runner.temp }}/yellowback-tests
        run: |
          mkdir -p "$TMPDIR"
          qa/pull-tester/rpc-tests.py -j2 --nozmq --nocleanup yellowback_reorg_stress
      # Later phases add here (§6.0 item 6): the STOCK_BASELINE a second time with
      # BITCOIND=qa/yellowback-wrapped-ycashd.sh (Phase 3, once -yellowback needs no genesis
      # arguments); yellowback_enforcement.py --extended and yellowback_runbook.py (Phases 4-5);
      # the ycash-legacy worktree build, yellowback_stockparity.py, yellowback_stock_node.py and
      # yellowback_enforcement.py --stock-binary (Phase 3+).
      - name: Fuzz smoke (N34)
        # Independent check: runs even if an earlier step failed, so one red result
        # does not hide the others. The job still fails overall.
        if: ${{ !cancelled() }}
        # Ycash's harness builds one target at a time: --enable-fuzz-main replaces main() and the
        # target's fuzz.cpp is linked as src/fuzz.cpp (plan §6.0 item 0). Each Yellowback target
        # runs 10 minutes from its corpus; findings land in <Target>/output and are uploaded, and
        # every file copied into <Target>/crashes/ is replayed by yellowback_fuzz_tests forever.
        run: |
          set -e
          sudo apt-get install -y clang
          CONFIG_SITE="$PWD/depends/x86_64-pc-linux-gnu/share/config.site" ./configure --enable-fuzz-main \
            CC=clang CXX=clang++ CXXFLAGS='-fsanitize=fuzzer,address' LDFLAGS='-fsanitize=fuzzer,address'
          for t in YellowbackTag YellowbackPayload YellowbackScript YellowbackEvaluate YellowbackPayee YellowbackBundle; do
            ln -sf fuzzing/$t/fuzz.cpp src/fuzz.cpp
            make -C src -j$(nproc) ycashd
            mkdir -p src/fuzzing/$t/output
            ASAN_OPTIONS=detect_leaks=0 src/ycashd src/fuzzing/$t/output src/fuzzing/$t/input -max_len=4096 -max_total_time=600
          done
      - name: Upload fuzz findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yellowback-fuzz-findings
          path: src/fuzzing/Yellowback*/output/crash-*
          if-no-files-found: ignore
      - name: Upload node logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: yellowback-nightly-logs
          path: ${{ runner.temp }}/yellowback-tests/**/node*/regtest/debug.log
          if-no-files-found: ignore
      - name: Open an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" --title "nightly failed: run $GITHUB_RUN_ID" \
            --body "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" || true

  # The three variant builds of §6.0 item 6 (P6): a DEBUG_LOCKORDER build over the functional
  # suite, the sanitizers over the unit suites and three scripts, and lcov with the per-file
  # floors of qa/yellowback-coverage-floor.sh. Nightly; never block; open an issue on failure.
  lockorder:
    if: (github.event_name == 'schedule' && github.event.schedule == '0 3 * * *') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 600
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libc6-dev m4 g++-multilib \
            autoconf libtool ncurses-dev unzip git python3 python3-zmq zlib1g-dev curl bsdmainutils \
            automake libtinfo5
      - name: Install Python test prerequisites
        run: |
          python3 -m pip install --user simplejson
          site=$(python3 -c 'import site; print(site.getusersitepackages())')
          mkdir -p "$site"
          printf '%s\n' '"""Shim: pyblake2 is unmaintained; Python 3.6+ has hashlib.blake2b with the same API."""' \
                        'from hashlib import blake2b, blake2s  # noqa: F401' > "$site/pyblake2.py"
      - uses: actions/cache@v4
        with:
          path: |
            depends/x86_64-pc-linux-gnu
            depends/built
            depends/sources
          key: depends-${{ runner.os }}-${{ hashFiles('depends/packages/**', 'depends/Makefile', 'depends/hosts/**', 'depends/builders/**') }}
      - uses: actions/cache@v4
        with:
          path: ~/.zcash-params
          key: zcash-params-${{ hashFiles('zcutil/fetch-params.sh') }}
      - run: ./zcutil/fetch-params.sh
      - run: BUILD_STAGE=depends ./zcutil/build.sh -j$(nproc)
      - name: Build with --enable-debug (defines DEBUG_LOCKORDER, configure.ac:249)
        run: |
          ./autogen.sh
          CONFIG_SITE="$PWD/depends/x86_64-pc-linux-gnu/share/config.site" ./configure --enable-debug
          make -C src -j$(nproc) ycashd ycash-cli test/test_bitcoin
      - name: Functional suite under DEBUG_LOCKORDER (sync.cpp aborts on a potential deadlock)
        env:
          TMPDIR: ${{ runner.temp }}/yellowback-tests
        run: |
          mkdir -p "$TMPDIR"
          qa/pull-tester/rpc-tests.py -j2 --nozmq --nocleanup $YELLOWBACK_SCRIPTS $STOCK_BASELINE
      - name: No potential deadlock in any debug.log
        if: always()
        run: |
          ! grep -rl 'potential deadlock detected' "${{ runner.temp }}/yellowback-tests" 2>/dev/null | grep .
      - name: Upload node logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: yellowback-lockorder-logs
          path: ${{ runner.temp }}/yellowback-tests/**/node*/regtest/debug.log
          if-no-files-found: ignore
      - name: Open an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" --title "lockorder failed: run $GITHUB_RUN_ID" \
            --body "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" || true

  sanitizers:
    if: (github.event_name == 'schedule' && github.event.schedule == '0 3 * * *') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 600
    permissions:
      contents: read
      issues: write
    env:
      ASAN_OPTIONS: detect_leaks=0
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v4
      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libc6-dev m4 g++-multilib \
            autoconf libtool ncurses-dev unzip git python3 python3-zmq zlib1g-dev curl bsdmainutils \
            automake libtinfo5 clang
      - name: Install Python test prerequisites
        run: |
          python3 -m pip install --user simplejson
          site=$(python3 -c 'import site; print(site.getusersitepackages())')
          mkdir -p "$site"
          printf '%s\n' '"""Shim: pyblake2 is unmaintained; Python 3.6+ has hashlib.blake2b with the same API."""' \
                        'from hashlib import blake2b, blake2s  # noqa: F401' > "$site/pyblake2.py"
      - uses: actions/cache@v4
        with:
          path: |
            depends/x86_64-pc-linux-gnu
            depends/built
            depends/sources
          key: depends-${{ runner.os }}-${{ hashFiles('depends/packages/**', 'depends/Makefile', 'depends/hosts/**', 'depends/builders/**') }}
      - uses: actions/cache@v4
        with:
          path: ~/.zcash-params
          key: zcash-params-${{ hashFiles('zcutil/fetch-params.sh') }}
      - run: ./zcutil/fetch-params.sh
      - run: BUILD_STAGE=depends ./zcutil/build.sh -j$(nproc)
      - name: address + undefined (configure.ac:211)
        env:
          TMPDIR: ${{ runner.temp }}/yellowback-tests
        run: |
          ./autogen.sh
          CONFIG_SITE="$PWD/depends/x86_64-pc-linux-gnu/share/config.site" ./configure --with-sanitizers=address,undefined CC=clang CXX=clang++
          make -C src -j$(nproc) ycashd ycash-cli test/test_bitcoin
          src/test/test_bitcoin --run_test='yellowback_*'
          mkdir -p "$TMPDIR"
          qa/pull-tester/rpc-tests.py -j2 --nozmq --nocleanup $SANITIZER_SCRIPTS
      - name: thread
        run: |
          make -C src clean
          CONFIG_SITE="$PWD/depends/x86_64-pc-linux-gnu/share/config.site" ./configure --with-sanitizers=thread CC=clang CXX=clang++
          make -C src -j$(nproc) test/test_bitcoin
          src/test/test_bitcoin --run_test='yellowback_*,miner_tests,mempool_tests'
      - name: Upload node logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: yellowback-sanitizer-logs
          path: ${{ runner.temp }}/yellowback-tests/**/node*/regtest/debug.log
          if-no-files-found: ignore
      - name: Open an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" --title "sanitizers failed: run $GITHUB_RUN_ID" \
            --body "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" || true

  coverage:
    if: (github.event_name == 'schedule' && github.event.schedule == '0 3 * * *') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 600
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libc6-dev m4 g++-multilib \
            autoconf libtool ncurses-dev unzip git python3 python3-zmq zlib1g-dev curl bsdmainutils \
            automake libtinfo5 lcov
      - name: Install Python test prerequisites
        run: |
          python3 -m pip install --user simplejson
          site=$(python3 -c 'import site; print(site.getusersitepackages())')
          mkdir -p "$site"
          printf '%s\n' '"""Shim: pyblake2 is unmaintained; Python 3.6+ has hashlib.blake2b with the same API."""' \
                        'from hashlib import blake2b, blake2s  # noqa: F401' > "$site/pyblake2.py"
      - uses: actions/cache@v4
        with:
          path: |
            depends/x86_64-pc-linux-gnu
            depends/built
            depends/sources
          key: depends-${{ runner.os }}-${{ hashFiles('depends/packages/**', 'depends/Makefile', 'depends/hosts/**', 'depends/builders/**') }}
      - uses: actions/cache@v4
        with:
          path: ~/.zcash-params
          key: zcash-params-${{ hashFiles('zcutil/fetch-params.sh') }}
      - run: ./zcutil/fetch-params.sh
      - run: BUILD_STAGE=depends ./zcutil/build.sh -j$(nproc)
      - name: Build with --enable-lcov (configure.ac:167), unit and functional suites against the instrumented ycashd
        env:
          TMPDIR: ${{ runner.temp }}/yellowback-tests
        run: |
          ./autogen.sh
          CONFIG_SITE="$PWD/depends/x86_64-pc-linux-gnu/share/config.site" ./configure --enable-lcov
          make -C src -j$(nproc) ycashd ycash-cli test/test_bitcoin
          make check || true
          src/test/test_bitcoin
          mkdir -p "$TMPDIR"
          qa/pull-tester/rpc-tests.py -j2 --nozmq --nocleanup $YELLOWBACK_SCRIPTS
      - name: lcov over src/yellowback and src/rpc/yellowback*, the floors of qa/yellowback-coverage-floor.sh
        run: |
          lcov --capture --directory src --output-file lcov-all.info --rc lcov_branch_coverage=0
          lcov --extract lcov-all.info '*/src/yellowback/*' '*/src/rpc/yellowback*' --output-file lcov.info
          lcov --list lcov.info
          genhtml lcov.info --output-directory coverage-html
          qa/yellowback-coverage-floor.sh lcov.info
      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yellowback-coverage
          path: |
            lcov.info
            coverage-html
          if-no-files-found: ignore
      - name: Open an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" --title "coverage failed: run $GITHUB_RUN_ID" \
            --body "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" || true

  weekly-fuzz:
    # Two hours per Yellowback target with corpus minimisation, then a PR with the new corpus
    # files and the regenerated C++ replay table (plan §6.0 item 6, §7 "Fuzzing"). Never blocks.
    if: github.event_name == 'schedule' && github.event.schedule == '0 4 * * 0'
    runs-on: ubuntu-22.04
    timeout-minutes: 900
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libc6-dev m4 g++-multilib \
            autoconf libtool ncurses-dev unzip git python3 zlib1g-dev curl bsdmainutils automake libtinfo5 clang
      - uses: actions/cache@v4
        with:
          path: |
            depends/x86_64-pc-linux-gnu
            depends/built
            depends/sources
          key: depends-${{ runner.os }}-${{ hashFiles('depends/packages/**', 'depends/Makefile', 'depends/hosts/**', 'depends/builders/**') }}
      - run: BUILD_STAGE=depends ./zcutil/build.sh -j$(nproc)
      - name: Fuzz every target for two hours and minimise the corpus
        run: |
          set -e
          CONFIG_SITE="$PWD/depends/x86_64-pc-linux-gnu/share/config.site" ./configure --enable-fuzz-main \
            CC=clang CXX=clang++ CXXFLAGS='-fsanitize=fuzzer,address' LDFLAGS='-fsanitize=fuzzer,address'
          for t in YellowbackTag YellowbackPayload YellowbackScript YellowbackEvaluate YellowbackPayee YellowbackBundle; do
            ln -sf fuzzing/$t/fuzz.cpp src/fuzz.cpp
            make -C src -j$(nproc) ycashd
            mkdir -p src/fuzzing/$t/output src/fuzzing/$t/merged
            ASAN_OPTIONS=detect_leaks=0 src/ycashd src/fuzzing/$t/output src/fuzzing/$t/input -max_len=4096 -max_total_time=7200 || true
            # Crashes become permanent replay cases; the minimised corpus (seeds + new coverage) replaces input/.
            for c in src/fuzzing/$t/output/crash-*; do [ -f "$c" ] && cp "$c" "src/fuzzing/$t/crashes/$(date +%Y%m%d)-$(basename "$c")"; done
            ASAN_OPTIONS=detect_leaks=0 src/ycashd -merge=1 src/fuzzing/$t/merged src/fuzzing/$t/input src/fuzzing/$t/output
            i=0; for f in src/fuzzing/$t/merged/*; do [ -f "$f" ] || continue; case "$(basename "$f")" in *.bin) ;; *) mv "$f" "src/fuzzing/$t/input/fuzz-$(date +%Y%m%d)-$i.bin"; i=$((i+1));; esac; done
          done
          python3 src/test/gen_yellowback_corpus.py --write || true
          git add -f src/fuzzing/Yellowback*/input src/fuzzing/Yellowback*/crashes src/test/yellowback_fuzz_tests.cpp
      - name: Open a PR with the new corpus files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --cached --quiet; then echo "no new corpus files"; exit 0; fi
          branch="weekly-fuzz/$(date +%Y%m%d)"
          git config user.name "yellowback-weekly-fuzz"
          git config user.email "weekly-fuzz@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -m "fuzz: weekly corpus update ($(date +%Y-%m-%d))"
          git push origin "$branch"
          gh pr create --repo "$GITHUB_REPOSITORY" --base feature/yellowback-sf --head "$branch" \
            --title "fuzz: weekly corpus update $(date +%Y-%m-%d)" \
            --body "New corpus files and crashes from the weekly 2 h/target libFuzzer run; the C++ replay table was regenerated by gen_yellowback_corpus.py --write. Any file under crashes/ is a finding to fix before merging." || true

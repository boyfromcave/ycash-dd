name: yellowback tests

# Fork-local CI for the Yellowback overlay. Upstream Ycash runs no tests in CI (book.yml only).
# Uses the same zcutil/build.sh a developer runs locally so a green CI and a green laptop mean the
# same thing. See docs/plans/yellowback-v1-development-plan.md §6.0 item 6 in the workspace.

on:
  push:
    branches:
      - feature/digidollar
  pull_request:
    branches:
      - feature/digidollar
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libc6-dev m4 g++-multilib \
            autoconf libtool ncurses-dev unzip git python3 python3-zmq zlib1g-dev curl bsdmainutils \
            automake libtinfo5

      - name: Cache depends
        id: cache-depends
        uses: actions/cache@v4
        with:
          path: |
            depends/x86_64-pc-linux-gnu
            depends/built
            depends/sources
          key: depends-${{ runner.os }}-${{ hashFiles('depends/packages/**', 'depends/Makefile', 'depends/hosts/**', 'depends/builders/**') }}

      - name: Build depends
        if: steps.cache-depends.outputs.cache-hit != 'true'
        run: BUILD_STAGE=depends ./zcutil/build.sh -j$(nproc)

      - name: Cache zk parameters
        id: cache-params
        uses: actions/cache@v4
        with:
          path: ~/.zcash-params
          key: zcash-params-${{ hashFiles('zcutil/fetch-params.sh') }}

      - name: Fetch zk parameters
        if: steps.cache-params.outputs.cache-hit != 'true'
        run: ./zcutil/fetch-params.sh

      - name: Build ycashd
        run: ./zcutil/build.sh -j$(nproc)

      - name: Determinism audit (plan §3.10, §8.4 items 2 and 8)
        # The state machine and the pure modules may not read the clock, the mempool, the wallet or
        # configuration, and must never use floating point; the overlay adds no networking to the node.
        run: |
          set -e
          ! grep -n "GetTime\|GetAdjustedTime\|mempool\|pwalletMain\|GetArg\|double\|float" \
              src/yellowback/state.cpp src/yellowback/state.h src/yellowback/math.h src/yellowback/payload.cpp \
              src/yellowback/payload.h src/yellowback/script.cpp src/yellowback/script.h src/yellowback/view.cpp src/yellowback/view.h
          ! grep -n "evhttp\|socket\|connect(" src/yellowback/*.cpp src/yellowback/*.h src/rpc/yellowback*.cpp
          # The consensus set is untouched (plan §1, §4.1).
          test -z "$(git diff --stat ycash-legacy...HEAD -- src/main.cpp src/consensus src/script src/primitives src/pow src/chainparams.cpp src/wallet src/txdb.cpp src/txdb.h configure.ac 2>/dev/null)"

      - name: Unit tests (yellowback_*)
        run: src/test/test_bitcoin --run_test='yellowback_*' --log_level=test_suite

      - name: Functional tests (yellowback_*)
        # Names must be listed explicitly: rpc-tests.py does not glob (G3). Extend this list as
        # phases add scripts to BASE_SCRIPTS.
        run: |
          qa/pull-tester/rpc-tests.py -j4 --nozmq \
            yellowback_index yellowback_lifecycle yellowback_void_mint yellowback_wallet_restore \
            yellowback_federation yellowback_protection

      - name: Upload node logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: yellowback-test-logs
          path: |
            /tmp/**/node*/regtest/debug.log
            /tmp/**/yellowback-fed*.log
          if-no-files-found: ignore

  nightly:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-22.04
    timeout-minutes: 600
    steps:
      - uses: actions/checkout@v4
      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libc6-dev m4 g++-multilib \
            autoconf libtool ncurses-dev unzip git python3 python3-zmq zlib1g-dev curl bsdmainutils \
            automake libtinfo5
      - uses: actions/cache@v4
        with:
          path: |
            depends/x86_64-pc-linux-gnu
            depends/built
            depends/sources
          key: depends-${{ runner.os }}-${{ hashFiles('depends/packages/**', 'depends/Makefile', 'depends/hosts/**', 'depends/builders/**') }}
      - uses: actions/cache@v4
        with:
          path: ~/.zcash-params
          key: zcash-params-${{ hashFiles('zcutil/fetch-params.sh') }}
      - run: ./zcutil/fetch-params.sh
      - run: ./zcutil/build.sh -j$(nproc)
      - name: Full make check
        run: make check
      - name: Reorg stress (extended)
        run: qa/pull-tester/rpc-tests.py -j2 --nozmq yellowback_reorg_stress
      - name: Inherited functional tests recorded as passing in Phase 0
        # Fill in from doc/yellowback.md "Build and test baseline".
        run: qa/pull-tester/rpc-tests.py -j4 --nozmq

#
# cargo-deny policy for the node's own Rust graph (Cargo.toml / Cargo.lock at the root: src/rust, the
# librustzcash glue). The attestor agent has its own (contrib/yellowback/attest/deny.toml). CI:
# .github/workflows/secops.yml, job cargo-deny:
#   cargo deny --locked --manifest-path Cargo.toml --config contrib/secops/deny-node.toml check advisories bans sources
# Every ignore carries its reason; the same list, with an expiry, is in osv-scanner.toml.

[graph]
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-pc-windows-gnu"]

[advisories]
version = 2
yanked = "warn"

#
# cargo-deny policy for the node's own Rust graph (Cargo.toml / Cargo.lock at the root: src/rust, the
# librustzcash glue). The attestor agent has its own (contrib/yellowback/attest/deny.toml). CI:
# .github/workflows/secops.yml, job cargo-deny:
#   cargo deny --locked --manifest-path Cargo.toml --config contrib/secops/deny-node.toml check advisories bans sources
# Every ignore carries its reason; the same list, with an expiry, is in osv-scanner.toml.

[graph]
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-pc-windows-gnu"]

[advisories]
version = 2
yanked = "warn"
ignore = [
    { id = "RUSTSEC-2021-0060", reason = "Unmaintained/renamed-crate notice, no vulnerability. Pulled in by the v4.5.0 librustzcash graph (src/rust, Cargo.lock); it leaves with the next librustzcash upgrade of this line, which is a node-dependency change of its own, not a lockfile bump." },
    { id = "RUSTSEC-2021-0059", reason = "Unmaintained/renamed-crate notice, no vulnerability. Pulled in by the v4.5.0 librustzcash graph (src/rust, Cargo.lock); it leaves with the next librustzcash upgrade of this line, which is a node-dependency change of its own, not a lockfile bump." },
    { id = "RUSTSEC-2021-0064", reason = "Unmaintained/renamed-crate notice, no vulnerability. Pulled in by the v4.5.0 librustzcash graph (src/rust, Cargo.lock); it leaves with the next librustzcash upgrade of this line, which is a node-dependency change of its own, not a lockfile bump." },
    { id = "RUSTSEC-2021-0139", reason = "Unmaintained/renamed-crate notice, no vulnerability. Pulled in by the v4.5.0 librustzcash graph (src/rust, Cargo.lock); it leaves with the next librustzcash upgrade of this line, which is a node-dependency change of its own, not a lockfile bump." },
    { id = "RUSTSEC-2020-0025", reason = "Unmaintained/renamed-crate notice, no vulnerability. Pulled in by the v4.5.0 librustzcash graph (src/rust, Cargo.lock); it leaves with the next librustzcash upgrade of this line, which is a node-dependency change of its own, not a lockfile bump." },
    { id = "RUSTSEC-2020-0168", reason = "Unmaintained/renamed-crate notice, no vulnerability. Pulled in by the v4.5.0 librustzcash graph (src/rust, Cargo.lock); it leaves with the next librustzcash upgrade of this line, which is a node-dependency change of its own, not a lockfile bump." },
    { id = "RUSTSEC-2024-0384", reason = "Unmaintained/renamed-crate notice, no vulnerability. Pulled in by the v4.5.0 librustzcash graph (src/rust, Cargo.lock); it leaves with the next librustzcash upgrade of this line, which is a node-dependency change of its own, not a lockfile bump." },
    { id = "RUSTSEC-2025-0023", reason = "Metrics exporter only (metrics-exporter-prometheus 0.3 on hyper =0.14.12/tokio 1.18.5, the newest that build on this line's Rust 1.51). Off unless -prometheusport is set, bound to -metricsallowip addresses, serving GET /metrics; the request-smuggling/data-race classes need a fronting proxy or API use the exporter does not make. Tracked for the librustzcash/metrics upgrade (owner follow-up)." },
    { id = "RUSTSEC-2021-0113", reason = "Metrics exporter only (metrics-exporter-prometheus 0.3 on hyper =0.14.12/tokio 1.18.5, the newest that build on this line's Rust 1.51). Off unless -prometheusport is set, bound to -metricsallowip addresses, serving GET /metrics; the request-smuggling/data-race classes need a fronting proxy or API use the exporter does not make. Tracked for the librustzcash/metrics upgrade (owner follow-up)." },
    { id = "RUSTSEC-2026-0204", reason = "Soundness issue whose trigger this node does not reach: 32-bit Atomic*64 arithmetic, fmt::Pointer of crossbeam Atomic, Iter of thread_local under data races, custom rand loggers, raw-cpuid Deserialize, memoffset on uninitialised types; all transitive through bellman/rayon/tracing in the v4.5.0 graph. Leaves with the librustzcash upgrade." },
    { id = "RUSTSEC-2022-0041", reason = "Soundness issue whose trigger this node does not reach: 32-bit Atomic*64 arithmetic, fmt::Pointer of crossbeam Atomic, Iter of thread_local under data races, custom rand loggers, raw-cpuid Deserialize, memoffset on uninitialised types; all transitive through bellman/rayon/tracing in the v4.5.0 graph. Leaves with the librustzcash upgrade." },
    { id = "RUSTSEC-2026-0097", reason = "Soundness issue whose trigger this node does not reach: 32-bit Atomic*64 arithmetic, fmt::Pointer of crossbeam Atomic, Iter of thread_local under data races, custom rand loggers, raw-cpuid Deserialize, memoffset on uninitialised types; all transitive through bellman/rayon/tracing in the v4.5.0 graph. Leaves with the librustzcash upgrade." },
    { id = "RUSTSEC-2023-0045", reason = "Soundness issue whose trigger this node does not reach: 32-bit Atomic*64 arithmetic, fmt::Pointer of crossbeam Atomic, Iter of thread_local under data races, custom rand loggers, raw-cpuid Deserialize, memoffset on uninitialised types; all transitive through bellman/rayon/tracing in the v4.5.0 graph. Leaves with the librustzcash upgrade." },
    { id = "RUSTSEC-2020-0071", reason = "localtime_r segfault (time 0.1.44, via chrono's oldtime feature) needs a concurrent setenv; ycashd sets no environment variables after start. Via tracing-subscriber/tracing-appender of the v4.5.0 graph." },
    { id = "RUSTSEC-2025-0055", reason = "tracing-subscriber 0.2 ANSI log poisoning: the node logs its own lines and the operator's own -debug filter, not raw network input; the fix is in 0.3, a breaking upgrade this line's Rust 1.51 cannot build." },
    { id = "RUSTSEC-2026-0386", reason = "tokio AsyncFd safe constructors (new/with_interest/try_new/try_with_interest) violate I/O safety. ycashd never constructs an AsyncFd: src/rust has no use of it and the metrics exporter (hyper 0.14 http1 server) uses TcpListener only. The fix is a deprecation in tokio >= 1.51.6/1.53.3, which needs a far newer rustc than this line's 1.51; it leaves with the librustzcash/metrics upgrade." },
    { id = "RUSTSEC-2024-0344", reason = "curve25519-dalek 3.0.2 Scalar sub timing: used through ed25519-zebra for JoinSplit signature verification, i.e. public inputs only; no secret scalar is processed." },
]

[bans]
# Duplicate versions are the v4.5.0 graph as upstream left it; bans would only report them.
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# The Ycash Foundation librustzcash fork the root Cargo.toml [patch.crates-io] pins by rev.
allow-git = ["https://github.com/ycashfoundation/librustzcash.git"]

# OSV-Scanner policy (.github/workflows/secops.yml, SECURITY-CI.md). An advisory that is not fixed by a
# lockfile bump within this repository's pin rules is listed here with its reason and an ignoreUntil at
# most 90 days out; on that date it fails CI again and is re-triaged. Triaged 2026-10-23 (osv-scanner 2.6.0).
# The same reasons are in contrib/secops/deny-node.toml for cargo-deny.


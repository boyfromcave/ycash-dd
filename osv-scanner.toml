[[IgnoredVulns]]
id = "RUSTSEC-2026-0386"
ignoreUntil = 2027-01-21T00:00:00Z
reason = "tokio AsyncFd safe constructors (new/with_interest/try_new/try_with_interest) violate I/O safety. ycashd never constructs an AsyncFd: src/rust has no use of it and the metrics exporter (hyper 0.14 http1 server) uses TcpListener only. The fix is a deprecation in tokio >= 1.51.6/1.53.3, which needs a far newer rustc than this line's 1.51; it leaves with the librustzcash/metrics upgrade."

[[IgnoredVulns]]
id = "GHSA-qwgh-2vcv-g2f7"
ignoreUntil = 2027-01-25T00:00:00Z
reason = "Cargo.lock (block-buffer 0.9.0, the v4.5.0 librustzcash graph: a newer line is the librustzcash upgrade of this line, not a lock bump) and contrib/yellowback/attest/Cargo.lock (0.10.4; its 0.12.1 is fixed). GHSA-qwgh-2vcv-g2f7 (moderate, GitHub-only, not in the RustSec database cargo-deny reads): a panic caught inside a digest's compress callback can leave block-buffer's cursor out of range, so a later use of the same buffer reads or writes out of bounds. Fixed only in 0.12.1 (the digest 0.11 line); the digest 0.10 line, which every released sha2/sha3/blake2 still uses, has no fixed release. Unreachable in ycashd: the Rust library builds with panic = 'abort' (Cargo.toml [profile.release]), so no panic is ever caught, and neither src/rust nor the attestor calls catch_unwind. Revisit when the RustCrypto hashes ship on digest 0.11."
